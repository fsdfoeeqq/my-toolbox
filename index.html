<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TAO TOOLBOX - Web App Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent:#00D4FF; --accent-dim:rgba(0,212,255,0.15);
    --bg:#030a18; --bg_card:rgba(5,15,35,0.92); --border:rgba(0,212,255,0.22);
    --text:#b8d4f0; --text-dim:rgba(100,160,200,0.65);
    --font_main:'Outfit',sans-serif; --font_mono:'JetBrains Mono',monospace;
  }
  body { background-color: var(--bg); color: var(--text); font-family: var(--font_main); min-height: 100vh; overflow-y: auto; padding-bottom: 40px; }

  .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  .header { text-align: center; margin-bottom: 2px; }
  .logo-text { font-size: 28px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(135deg,var(--accent),#0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { font-size: 12px; color: var(--text-dim); font-family: var(--font_mono); margin-top: 2px; }

  .panel { background: var(--bg_card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; backdrop-filter: blur(20px); box-shadow: 0 10px 35px rgba(0,0,0,0.45); }
  .panel-title { font-size: 16px; font-weight: 800; color: var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .panel-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }

  .input-row { margin-bottom: 12px; }
  .input-label { display: block; font-size: 12px; font-weight: 700; color: rgba(200,220,240,0.85); margin-bottom: 6px; }
  .input-field, select.input-field { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: var(--text); font-family: var(--font_mono); font-size: 13px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 768px) { .grid-two { grid-template-columns: 1fr; } }

  .btn-primary { width: 100%; padding: 15px 20px; border: 1px solid var(--accent); border-radius: 10px; background: linear-gradient(135deg,rgba(0,212,255,0.2),rgba(0,102,255,0.12)); color: var(--accent); font-family: var(--font_main); font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,212,255,0.15); text-align: center; }
  .btn-primary:hover { filter: brightness(1.25); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,255,0.25); }

  .cbtn-lg { min-width: 110px; padding: 12px 18px; border: 1.5px solid rgba(0,255,136,0.35); border-radius: 10px; background: rgba(0,255,136,0.12); color: #00ff88; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .cbtn-lg:hover { background: rgba(0,255,136,0.24); filter: brightness(1.2); transform: translateY(-1px); }

  .row-copy-btn { padding: 9px 16px; background: rgba(0,212,255,0.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.2s; min-width: 55px; text-align: center; }
  .row-copy-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 12px rgba(0,212,255,0.4); }

  .btn-copy-phone { background: rgba(0,255,136,0.12); border-color: #00ff88; color: #00ff88; font-size: 12px; padding: 8px 14px; font-weight: 700; }
  .btn-copy-phone:hover { background: #00ff88; color: #000; }
  .btn-copy-addr { background: rgba(255,200,0,0.12); border-color: #ffcc00; color: #ffcc00; font-size: 12px; padding: 8px 14px; font-weight: 700; }
  .btn-copy-addr:hover { background: #ffcc00; color: #000; }
  .btn-copy-all { background: rgba(0,212,255,0.16); border-color: var(--accent); color: var(--accent); font-size: 13px; padding: 9px 18px; font-weight: 800; }
  .btn-copy-all:hover { background: var(--accent); color: #000; }

  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .result-title { font-size: 14px; font-weight: 800; color: var(--accent); }
  .count-badge { font-size: 11px; background: var(--accent-dim); color: var(--accent); padding: 4px 10px; border-radius: 14px; font-family: var(--font_mono); font-weight: bold; }

  .result-rows-box { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .result-item-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.35); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); gap: 12px; }
  .result-item-text { font-family: var(--font_mono); font-size: 12.5px; word-break: break-all; color: #fff; flex: 1; line-height: 1.5; }

  .notice { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00ff88; color: #000; padding: 10px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; z-index: 9999; box-shadow: 0 4px 20px rgba(0,255,136,0.4); animation: fadein 0.3s; }
  .hidden { display: none !important; }
  @keyframes fadein { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-text">TAO TOOLBOX</div>
    <div class="tagline">Serverless Edition · Unlimited Address Combinatorics</div>
  </div>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🥇 อันดับที่ 1: 🎲 สุ่มข้อมูลแบบครบชุด (Farm Core Generator) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div>
    <div class="panel" style="margin-bottom: 16px; border-color: rgba(0,212,255,0.4);">
      <div class="panel-title">
        <span>🎲 สุ่มข้อมูลแบบครบชุด (Farm Core Unlimited)</span>
        <span class="count-badge" id="farmBadge">0 ชุด</span>
      </div>

      <div class="grid-two">
        <div class="input-row">
          <label class="input-label">🔢 จำนวนชุด</label>
          <input type="number" id="farmCount" class="input-field" value="1" min="1" max="50" oninput="saveSettings()" />
        </div>
        <div class="input-row">
          <label class="input-label">🌍 ประเภทที่อยู่</label>
          <select id="farmAddrType" class="input-field" onchange="saveSettings()">
            <option value="en_random" selected>🌍 อังกฤษ (สุ่มประเทศ - สหรัฐ/อังกฤษ/ออสเตรเลีย/แคนาดา/เอเชีย)</option>
            <option value="en_us">🇺🇸 สหรัฐอเมริกา (United States)</option>
            <option value="en_uk">🇬🇧 สหราชอาณาจักร (United Kingdom)</option>
            <option value="en_ca">🇨🇦 แคนาดา (Canada)</option>
            <option value="en_au">🇦🇺 ออสเตรเลีย (Australia)</option>
            <option value="en_sg">🇸🇬 สิงคโปร์ (Singapore)</option>
            <option value="en_my">🇲🇾 มาเลเซีย (Malaysia)</option>
            <option value="en_ph">🇵🇭 ฟิลิปปินส์ (Philippines)</option>
            <option value="en_id">🇮🇩 อินโดนีเซีย (Indonesia)</option>
            <option value="en_vn">🇻🇳 เวียดนาม (Vietnam)</option>
            <option value="th">🇹🇭 ไทย (ชุด 1 ดัดแปลงคำ)</option>
          </select>
        </div>
      </div>

      <div class="grid-two">
        <div class="input-row">
          <label class="input-label">✏️ ข้อความฐาน (จะถูกนำไปแทรกกระจายในที่อยู่อัตโนมัติ)</label>
          <input type="text" id="farmBase" class="input-field" value="เสริม สวย มิ้น" placeholder="เช่น หมู่ 7 ตำบลกันจุ เสริมสวย มิ้น" oninput="saveSettings()" />
        </div>
        <div class="input-row">
          <label class="input-label">💪 ความแรงการดัดแปลง (เฉพาะภาษาไทย)</label>
          <select id="farmStrength" class="input-field" onchange="saveSettings()">
            <option value="น้อย">น้อย</option>
            <option value="ปกติ" selected>ปกติ</option>
            <option value="มาก">มาก</option>
          </select>
        </div>
      </div>

      <div class="grid-two" style="margin-bottom:8px;">
        <label style="font-size:12.5px; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="chkHouse" checked onchange="saveSettings()" /> 🏠 สุ่มบ้านเลขที่ / ห้อง / อาคาร</label>
        <label style="font-size:12.5px; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="chkAz" checked onchange="saveSettings()" /> 🔤 แทรกตัวอักษร A-Z</label>
      </div>
      <div class="grid-two" style="margin-bottom:14px;">
        <label style="font-size:12.5px; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="chkDecor" onchange="saveSettings()" /> ✦ แทรกอักษรตกแต่งสัญลักษณ์</label>
        <label style="font-size:12.5px; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="chkCn" onchange="saveSettings()" /> 🀄 แทรกอักษรจีน</label>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn-primary" onclick="generateFarmData()" style="flex:2;">🎲 สุ่มทันที</button>
        <button class="btn-primary" onclick="toggleFarmQR()" style="flex:1; background:rgba(0,180,255,0.18); border-color:#00b4ff; color:#80d8ff;">📱 เปิด/ปิด QR</button>
      </div>

      <!-- โหมด Auto -->
      <div style="margin-top:14px; padding:12px 16px; border-radius:12px; background:rgba(255,200,0,0.06); border:1px solid rgba(255,200,0,0.25); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:12.5px; color:#FFD600; font-weight:700; display:flex; align-items:center; gap:6px;">
          🔄 ระบบสุ่มอัตโนมัติทำงานทุก 1 นาที (ไม่ซ้ำล้านรูปแบบ)
        </div>
        <span id="autoCountdown" style="font-family:var(--font_mono); font-size:13px; color:#FFD600; font-weight:800;">--:--</span>
      </div>
    </div>

    <!-- แผงผลลัพธ์ข้อมูล -->
    <div class="panel">
      <div class="result-header">
        <span class="result-title">📋 ผลลัพธ์ข้อมูลชุดล่าสุด</span>
      </div>

      <textarea id="farmNotepad" class="input-field hidden" rows="5"></textarea>
      <div id="farmQrSection" class="hidden" style="text-align:center; padding:14px; background:#fff; border-radius:12px; margin-bottom:12px;"></div>
      <div id="farmResultBox" class="result-rows-box"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🥈 อันดับที่ 2: 📌 ข้อความใช้ประจำ                          -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div class="panel">
    <div class="panel-title">📌 ข้อความใช้ประจำ (กดคัดลอกด่วน)</div>
    
    <div class="input-row">
      <label class="input-label">ข้อความที่ 1</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="freqText1" class="input-field" value="บ้านซับบอน ต.กันจุ" oninput="saveSettings()" />
        <button class="cbtn-lg" style="flex:none; width:110px;" onclick="clipCopy(document.getElementById('freqText1').value)">📋 ก๊อปปี้</button>
      </div>
    </div>

    <div class="input-row">
      <label class="input-label">ข้อความที่ 2</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="freqText2" class="input-field" value="ตำบล สามแยก อ.วิเชียรบุรี" oninput="saveSettings()" />
        <button class="cbtn-lg" style="flex:none; width:110px;" onclick="clipCopy(document.getElementById('freqText2').value)">📋 ก๊อปปี้</button>
      </div>
    </div>

    <div class="input-row">
      <label class="input-label">ข้อความที่ 3</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="freqText3" class="input-field" placeholder="เพิ่มข้อความใช้บ่อย..." oninput="saveSettings()" />
        <button class="cbtn-lg" style="flex:none; width:110px;" onclick="clipCopy(document.getElementById('freqText3').value)">📋 ก๊อปปี้</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🥉 อันดับที่ 3: 🗺️ รายชื่ออำเภอ/เขต (ครบทุกจังหวัด)         -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div class="panel">
    <div class="panel-title">
      <span>🗺️ รายชื่ออำเภอ/เขต (ตัด อ. ออกตอนคัดลอก)</span>
      <span class="count-badge" id="distCountBadge">0 รายการ</span>
    </div>

    <div class="grid-two">
      <div class="input-row">
        <label class="input-label">พื้นที่ภูมิภาค</label>
        <select id="distRegion" class="input-field" onchange="onRegionChange(); saveSettings();">
          <option value="all">ทั่วประเทศ</option>
          <option value="bangkok">กรุงเทพฯ</option>
          <option value="central">ภาคกลาง</option>
          <option value="north">ภาคเหนือ</option>
          <option value="northeast">ภาคอีสาน</option>
          <option value="east">ภาคตะวันออก</option>
          <option value="west">ภาคตะวันตก</option>
          <option value="south">ภาคใต้</option>
        </select>
      </div>

      <div class="input-row hidden" id="distProvinceRow">
        <label class="input-label">📍 จังหวัด</label>
        <select id="distProvince" class="input-field" onchange="listAllDistricts(); saveSettings();">
          <option value="">ทั้งภาค</option>
        </select>
      </div>
    </div>

    <div class="result-rows-box" id="distResultBox" style="margin-top:14px; max-height:280px;"></div>
  </div>

</div>

<div id="toastNotice" class="notice hidden">✅ คัดลอกสำเร็จ!</div>

<script>

// 1. ฐานข้อมูลอักขระ & ตกแต่ง
// =======================================================

function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function applyInjections(text, doAz, doDecor, doCn) {
  let tokens = text.split(' ');
  if (tokens.length < 2) tokens = text.split('');

  if (doAz && Math.random() < 0.7) {
    let k = randomInt(1, 3);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, '[' + String.fromCharCode(65 + randomInt(0, 25)) + ']');
  }
  if (doDecor && Math.random() < 0.75) {
    let k = randomInt(1, 4);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, randomChoice(DECOR_TOKENS));
  }
  if (doCn && Math.random() < 0.65) {
    let k = randomInt(1, 3);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, randomChoice(CN_CHARS));
  }
  return tokens.join(' ').replace(/\s+/g, ' ').trim();
}

function generateEnglishAddress(countryKey, useHouse, baseWords) {
  const countryList = Object.keys(EN_COUNTRY_DATA);
  let cName = countryKey;
  if (!cName || cName === "Random" || !EN_COUNTRY_DATA[cName]) {
    cName = randomChoice(countryList);
  }
  const cData = EN_COUNTRY_DATA[cName];

  let streetName = "";
  const roll = Math.random();
  if (roll < 0.4) {
    streetName = `${randomChoice(EN_STREET_PRE)} ${randomChoice(EN_STREET_CORE)} ${randomChoice(EN_STREET_TYPES)}`;
  } else if (roll < 0.75) {
    streetName = `${randomChoice(EN_STREET_CORE)} ${randomChoice(EN_STREET_TYPES)}`;
  } else {
    streetName = `${randomChoice(EN_STREET_PRE)} ${randomChoice(EN_STREET_TYPES)}`;
  }

  let line1 = "";
  const houseNum = randomInt(1, 9999);
  let unitExtra = "";
  if (Math.random() < 0.6) {
    const uType = randomChoice(EN_UNIT_TYPES);
    const uVal = Math.random() < 0.5 ? randomInt(1, 999) : `${String.fromCharCode(65 + randomInt(0, 25))}-${randomInt(101, 808)}`;
    unitExtra = `, ${uType} ${uVal}`;
  }

  line1 = useHouse ? `${houseNum} ${streetName}${unitExtra}` : `${streetName}${unitExtra}`;

  let bldgPart = "";
  if (Math.random() < 0.55) {
    bldgPart = `${randomChoice(EN_BLDG_PRE)} ${randomChoice(EN_BLDG_SUF)}`;
  }

  let landmarkPart = "";
  if (Math.random() < 0.45) {
    landmarkPart = `${randomChoice(EN_LANDMARK_PREP)} ${randomChoice(EN_LANDMARK_FAC)}`;
  }

  const city = randomChoice(cData.cities);
  const region = randomChoice(cData.regions);

  let zip = "";
  if (cData.postalGen) {
    zip = cData.postalGen();
  } else if (cData.zipMin && cData.zipMax) {
    zip = randomInt(cData.zipMin, cData.zipMax).toString();
  } else {
    zip = randomInt(10000, 99999).toString();
  }

  let parts = [line1];
  if (bldgPart) parts.push(bldgPart);
  if (landmarkPart) parts.push(landmarkPart);
  parts.push(city);
  parts.push(`${region} ${zip}`);

  let address = parts.filter(p => p).join(", ").trim();

  if (baseWords && baseWords.length > 0) {
    address = weaveWordsIntoAddress(address, baseWords);
  }

  return address;
}

function weaveWordsIntoAddress(address, words) {
  if (!words || words.length === 0) return address;
  let tokens = address.replace(/,/g, " ,").split(" ");
  if (tokens.length < 2) return address;

  let transformed = words.map(w => {
    if (Math.random() < 0.3) return w.replace('มิ้น', 'มินต์').replace('กันจุ', 'กันจุุ');
    return w;
  });

  let out = [];
  let wi = 0;
  for (let i = 0; i < tokens.length; i++) {
    out.push(tokens[i]);
    if (wi < transformed.length && i > 0 && (i % Math.max(1, Math.floor(tokens.length / (transformed.length + 1)))) === 0) {
      out.push(transformed[wi]);
      wi++;
    }
  }
  while (wi < transformed.length) {
    out.splice(randomInt(1, Math.max(1, out.length - 1)), 0, transformed[wi]);
    wi++;
  }
  return out.join(" ").replace(/ ,/g, ",").trim();
}

function showToast(msg) {
  const t = document.getElementById('toastNotice');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add('hidden'), 2000);
}

function clipCopy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ คัดลอกสำเร็จ!'));
  } else {
    let ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ คัดลอกสำเร็จ!');
  }
}

function onRegionChange() {
  const region = document.getElementById('distRegion').value;
  const provRow = document.getElementById('distProvinceRow');
  const provSelect = document.getElementById('distProvince');

  provSelect.innerHTML = '<option value="">ทั้งภาค</option>';

  if (region === 'all' || region === 'bangkok') {
    provRow.classList.add('hidden');
  } else {
    provRow.classList.remove('hidden');
    const provinces = Object.keys(THAI_DATA[region] || {});
    provinces.forEach(p => {
      let opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      provSelect.appendChild(opt);
    });
  }

  // อัปเดตแสดงผลทันทีเมื่อเปลี่ยนภูมิภาค
  listAllDistricts();
}

function listAllDistricts() {
  const region = document.getElementById('distRegion').value;
  const province = document.getElementById('distProvince').value;

  let results = [];

  if (region === 'all') {
    Object.keys(THAI_DATA).forEach(reg => {
      Object.keys(THAI_DATA[reg]).forEach(prov => {
        THAI_DATA[reg][prov].forEach(dist => {
          results.push(dist);
        });
      });
    });
  } else if (province === '') {
    Object.keys(THAI_DATA[region]).forEach(prov => {
      THAI_DATA[region][prov].forEach(dist => {
        results.push(dist);
      });
    });
  } else {
    THAI_DATA[region][province].forEach(dist => {
      results.push(dist);
    });
  }

  const countBadge = document.getElementById('distCountBadge');
  if (countBadge) countBadge.textContent = results.length + ' รายการ';

  const box = document.getElementById('distResultBox');
  if (!box) return;
  box.innerHTML = '';

  if (results.length === 0) {
    box.innerHTML = '<div style="text-align:center; color:var(--text-dim); padding:20px; font-size:13px;">ไม่พบข้อมูลอำเภอ</div>';
    return;
  }

  results.forEach((displayText, idx) => {
    // ตัด อ. ออกทันทีเมื่อคัดลอก เช่น "อ.บางระจัน" -> "บางระจัน"
    const cleanCopyText = displayText.replace(/^อ\.\s*/, '');
    let row = document.createElement('div');
    row.className = 'result-item-row';
    row.innerHTML = `
      <span class="result-item-text"><span style="color:var(--text-dim);">#${idx+1}</span> &nbsp; ${displayText}</span>
      <button class="row-copy-btn" onclick="clipCopy('${cleanCopyText}')">📋</button>
    `;
    box.appendChild(row);
  });
}

    if (addrType === "th") {
      let addrBase = baseText ? baseText : randomChoice(DEFAULT_BASES);
      if(Math.random() < 0.3) addrBase = addrBase.replace('มิ้น', 'มินต์').replace('กันจุ', 'กันจุุ');
      if(useHouse) addrBase = randomInt(1, 999) + '/' + randomInt(1, 99) + ' ' + addrBase;
      finalAddr = applyInjections(addrBase, doAz, doDecor, doCn);
    } else {
      let country = "Random";
      if (addrType === "en_us") country = "United States";
      else if (addrType === "en_uk") country = "United Kingdom";
      else if (addrType === "en_ca") country = "Canada";
      else if (addrType === "en_au") country = "Australia";
      else if (addrType === "en_sg") country = "Singapore";
      else if (addrType === "en_my") country = "Malaysia";
      else if (addrType === "en_ph") country = "Philippines";
      else if (addrType === "en_id") country = "Indonesia";
      else if (addrType === "en_vn") country = "Vietnam";

      let addrBase = generateEnglishAddress(country, useHouse, baseWords);
      finalAddr = applyInjections(addrBase, doAz, doDecor, doCn);
    }

    let fullLine = phone + " | " + finalAddr;
    _lastFarmData.push({ phone: phone, addr: finalAddr, full: fullLine });
    notepadText += (i+1) + ". " + fullLine + "\n";
  }

  const notepadEl = document.getElementById('farmNotepad');
  if (notepadEl) notepadEl.value = notepadText;
  
  const badgeEl = document.getElementById('farmBadge');
  if (badgeEl) badgeEl.textContent = count + ' ชุด';

  const box = document.getElementById('farmResultBox');
  if (!box) return;
  box.innerHTML = '';

  _lastFarmData.forEach((item, idx) => {
    let row = document.createElement('div');
    row.className = 'result-item-row';
    row.innerHTML = `
      <span class="result-item-text">
        <span style="color:#00ff88; font-weight:bold;">${item.phone}</span><br>${item.addr}
      </span>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="row-copy-btn btn-copy-phone" onclick="clipCopy('${item.phone}')">📱 เบอร์</button>
        <button class="row-copy-btn btn-copy-addr" onclick="clipCopy('${item.addr}')">🏠 ที่อยู่</button>
        <button class="row-copy-btn btn-copy-all" onclick="clipCopy('${item.full}')">📋 ทั้งคู่</button>
      </div>
    `;
    box.appendChild(row);
  });

  const qrBox = document.getElementById('farmQrSection');
  if(qrBox && !qrBox.classList.contains('hidden')) {
    qrBox.innerHTML = '';
    QRCode.toCanvas('📋\n' + notepadText, { width: 230, margin: 2 }, function(err, canvas) {
      if(!err) qrBox.appendChild(canvas);
    });
  }
}

function toggleFarmQR() {
  const qrBox = document.getElementById('farmQrSection');
  if (!qrBox) return;
  qrBox.classList.toggle('hidden');
  if(!qrBox.classList.contains('hidden') && _lastFarmData.length > 0) {
    qrBox.innerHTML = '';
    const notepadEl = document.getElementById('farmNotepad');
    const text = notepadEl ? notepadEl.value : '';
    QRCode.toCanvas('📋\n' + text, { width: 230, margin: 2 }, function(err, canvas) {
      if(!err) qrBox.appendChild(canvas);
    });
  }
}

// ระบบ Auto Timer 1 นาทีต่อเนื่อง
let autoInterval = null;
let countdownInterval = null;
let secondsLeft = 60;

function startAutoRandom() {
  if (autoInterval) clearInterval(autoInterval);
  if (countdownInterval) clearInterval(countdownInterval);

  secondsLeft = 60;
  generateFarmData();
  updateTimerUI();

  autoInterval = setInterval(() => {
    secondsLeft = 60;
    generateFarmData();
  }, 60000);

  countdownInterval = setInterval(() => {
    secondsLeft--;
    if (secondsLeft < 0) secondsLeft = 0;
    updateTimerUI();
  }, 1000);
}

function updateTimerUI() {
  let m = Math.floor(secondsLeft / 60);
  let s = secondsLeft % 60;
  const timerEl = document.getElementById('autoCountdown');
  if (timerEl) timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// เริ่มต้นทำงานทันทีเมื่อเปิดเว็บ
window.onload = function() {
  loadSettings();
  onRegionChange();
  startAutoRandom();
};
