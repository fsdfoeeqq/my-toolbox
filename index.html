<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TAO TOOLBOX - Web App Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent:#00D4FF; --accent-dim:rgba(0,212,255,0.15);
    --bg:#030a18; --bg_card:rgba(5,15,35,0.9); --border:rgba(0,212,255,0.2);
    --text:#b8d4f0; --text-dim:rgba(100,160,200,0.6);
    --font_main:'Outfit',sans-serif; --font_mono:'JetBrains Mono',monospace;
  }
  body { background-color: var(--bg); color: var(--text); font-family: var(--font_main); min-height: 100vh; overflow-y: auto; }

  .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .header { text-align: center; margin-bottom: 5px; }
  .logo-text { font-size: 26px; font-weight: 900; background: linear-gradient(135deg,var(--accent),#0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { font-size: 12px; color: var(--text-dim); font-family: var(--font_mono); }

  .panel { background: var(--bg_card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .panel-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }

  .input-row { margin-bottom: 12px; }
  .input-label { display: block; font-size: 12px; font-weight: 700; color: rgba(200,220,240,0.8); margin-bottom: 6px; }
  .input-field, select.input-field { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); font-family: var(--font_mono); font-size: 13px; outline: none; }
  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }

  .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media(max-width: 768px) { .panel-split { grid-template-columns: 1fr; } }

  .btn-primary { width: 100%; padding: 14px; border: 1px solid var(--accent); border-radius: 8px; background: linear-gradient(135deg,var(--accent-dim),rgba(0,0,0,0.2)); color: var(--accent); font-family: var(--font_main); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-primary:hover { filter: brightness(1.2); transform: translateY(-1px); }
  .btn-sub { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.4); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-sub:hover { border-color: var(--accent); color: var(--accent); }

  .cbtn { flex: 1; min-width: 100px; padding: 10px; border: 1px solid rgba(0,255,136,0.3); border-radius: 8px; background: rgba(0,255,136,0.1); color: #00ff88; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .cbtn:hover { background: rgba(0,255,136,0.2); }

  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .result-title { font-size: 14px; font-weight: bold; color: var(--accent); }
  .count-badge { font-size: 11px; background: var(--accent-dim); color: var(--accent); padding: 3px 8px; border-radius: 12px; }

  .result-rows-box { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .result-item-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); gap: 10px; }
  .result-item-text { font-family: var(--font_mono); font-size: 12px; word-break: break-all; color: #fff; flex: 1; }
  .row-copy-btn { padding: 6px 12px; background: rgba(0,212,255,0.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .row-copy-btn:hover { background: var(--accent); color: #000; }

  .notice { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00ff88; color: #000; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; z-index: 999; animation: fadein 0.3s; }
  .hidden { display: none !important; }
  @keyframes fadein { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-text">TAO TOOLBOX</div>
    <div class="tagline">Serverless Web App · Farm Core Inside</div>
  </div>

  <div class="panel-split">

    <!-- ─── คอลัมน์ซ้าย: ข้อความใช้ประจำ + รายชื่ออำเภอ/เขต ─── -->
    <div>
      <div class="panel">
        <div class="panel-title" style="margin-bottom: 12px;">📌 ข้อความใช้ประจำ</div>
        <div class="input-row">
          <label class="input-label">ข้อความที่ 1 (ค่าเริ่มต้น)</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="freqText1" class="input-field" value="บ้านซับบอน ต.กันจุ" oninput="saveSettings()" />
            <button class="row-copy-btn" onclick="clipCopy(document.getElementById('freqText1').value)">📋</button>
          </div>
        </div>
        <div class="input-row">
          <label class="input-label">ข้อความที่ 2</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="freqText2" class="input-field" placeholder="เพิ่มข้อความใช้บ่อย..." oninput="saveSettings()" />
            <button class="row-copy-btn" onclick="clipCopy(document.getElementById('freqText2').value)">📋</button>
          </div>
        </div>
        <div class="input-row">
          <label class="input-label">ข้อความที่ 3</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="freqText3" class="input-field" placeholder="เพิ่มข้อความใช้บ่อย..." oninput="saveSettings()" />
            <button class="row-copy-btn" onclick="clipCopy(document.getElementById('freqText3').value)">📋</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="result-header" style="border:none; padding:0; margin-bottom:12px;">
          <span class="panel-title">🗺️ รายชื่ออำเภอ/เขต (ครบทุกจังหวัด)</span>
          <span class="count-badge" id="distCountBadge">0 รายการ</span>
        </div>

        <div class="input-row">
          <label class="input-label">พื้นที่</label>
          <select id="distRegion" class="input-field" onchange="onRegionChange(); saveSettings();">
            <option value="all">ทั่วประเทศ</option>
            <option value="bangkok">กรุงเทพฯ</option>
            <option value="central">ภาคกลาง</option>
            <option value="north">ภาคเหนือ</option>
            <option value="northeast">ภาคอีสาน</option>
            <option value="east">ภาคตะวันออก</option>
            <option value="west">ภาคตะวันตก</option>
            <option value="south">ภาคใต้</option>
          </select>
        </div>

        <div class="input-row hidden" id="distProvinceRow">
          <label class="input-label">📍 จังหวัด</label>
          <select id="distProvince" class="input-field" onchange="saveSettings()">
            <option value="">ทั้งภาค</option>
          </select>
        </div>

        <div class="grid-two" style="margin-top:14px;">
          <button class="btn-primary" onclick="listAllDistricts()">📋 แสดงอำเภอทั้งหมด</button>
          <button class="btn-sub" onclick="copyAllDistricts()" style="background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.3); color:#00ff88;">📝 คัดลอกทั้งหมด</button>
        </div>

        <div class="result-rows-box" id="distResultBox" style="margin-top:15px; max-height:220px;"></div>
      </div>
    </div>

    <!-- ─── คอลัมน์ขวา: สุ่มชุดข้อมูลหลัก (Farm Core) ─── -->
    <div>
      <div class="panel">
        <div class="panel-title">🎲 สุ่มข้อมูลแบบครบชุด (จำลอง Farm Core)</div>

        <div class="grid-two">
          <div class="input-row">
            <label class="input-label">🔢 จำนวนชุด</label>
            <input type="number" id="farmCount" class="input-field" value="1" min="1" max="50" oninput="saveSettings()" />
          </div>
          <div class="input-row">
            <label class="input-label">💪 ความแรง (เฉพาะภาษาไทย)</label>
            <select id="farmStrength" class="input-field" onchange="saveSettings()">
              <option value="น้อย">น้อย</option>
              <option value="ปกติ" selected>ปกติ</option>
              <option value="มาก">มาก</option>
            </select>
          </div>
        </div>

        <div class="input-row">
          <label class="input-label">🌍 ประเภทที่อยู่</label>
          <select id="farmAddrType" class="input-field" onchange="saveSettings()">
            <option value="th">🇹🇭 ไทย (ชุด 1)</option>
            <option value="en_random" selected>🌍 อังกฤษ (สุ่มประเทศ)</option>
            <option value="en_id">🇮🇩 อินโดนีเซีย (Indonesia)</option>
            <option value="en_ph">🇵🇭 ฟิลิปปินส์ (Philippines)</option>
            <option value="en_my">🇲🇾 มาเลเซีย (Malaysia)</option>
            <option value="en_vn">🇻🇳 เวียดนาม (Vietnam)</option>
            <option value="en_us">🇺🇸 สหรัฐอเมริกา (United States)</option>
          </select>
        </div>

        <div class="input-row">
          <label class="input-label">✏️ ข้อความฐาน (จะถูกนำไปแทรกในที่อยู่ด้วย)</label>
          <input type="text" id="farmBase" class="input-field" value="เสริม สวย มิ้น" placeholder="เช่น หมู่ 7 ตำบลกันจุ เสริมสวย มิ้น" oninput="saveSettings()" />
        </div>

        <div class="grid-two" style="margin-bottom:8px;">
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="chkHouse" checked onchange="saveSettings()" /> 🏠 สุ่มบ้านเลขที่</label>
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="chkAz" checked onchange="saveSettings()" /> 🔤 แทรก A-Z</label>
        </div>
        <div class="grid-two" style="margin-bottom:12px;">
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="chkDecor" onchange="saveSettings()" /> ✦ แทรกตกแต่ง</label>
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="chkCn" onchange="saveSettings()" /> 🀄 แทรกตัวจีน</label>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn-primary" onclick="generateFarmData()" style="flex:2;">🎲 สุ่มทั้งหมด</button>
          <button class="btn-primary" onclick="toggleFarmQR()" style="flex:1; background:rgba(0,180,255,0.15); border-color:#00b4ff; color:#80d8ff; font-size:13px;">📱 เปิด QR</button>
        </div>

        <!-- โหมด Auto -->
        <div style="margin-top:14px; padding:12px; border-radius:10px; background:rgba(255,200,0,0.05); border:1px solid rgba(255,200,0,0.2); display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:12px; color:#FFD600; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="chkAuto" onchange="toggleAuto(); saveSettings();" /> 🔄 สุ่มออโต้ทุก 1 นาที
          </label>
          <span id="autoCountdown" style="font-family:var(--font_mono); font-size:12px; color:var(--text-dim);">--:--</span>
        </div>
      </div>

      <div class="panel">
        <div class="result-header">
          <span class="result-title">📋 ผลลัพธ์ข้อมูล</span>
          <span class="count-badge" id="farmBadge">0 ชุด</span>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button class="cbtn" onclick="copyNotepad()">📋 ก๊อปปี้แบบรวม (เพื่อส่ง)</button>
        </div>

        <textarea id="farmNotepad" class="input-field hidden" rows="5"></textarea>

        <div id="farmQrSection" class="hidden" style="text-align:center; padding:10px; background:#fff; border-radius:10px; margin-bottom:10px;"></div>

        <div id="farmResultBox" class="result-rows-box"></div>
      </div>
    </div>

  </div>
</div>

<div id="toastNotice" class="notice hidden">✅ คัดลอกแล้ว!</div>

    let pName = dist.replace("อ.เมือง", "");

  currentReg = null;
  for (let r in REGION_PROVINCES) {
    if (REGION_PROVINCES[r].includes(currentProv)) {
      currentReg = r;
      break;
    }
  }

  if (currentReg && currentProv) {
    if (!THAI_DATA[currentReg][currentProv]) THAI_DATA[currentReg][currentProv] = [];

function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function applyInjections(text, doAz, doDecor, doCn) {
  let tokens = text.split(' ');
  if (tokens.length < 2) tokens = text.split('');

  if (doAz && Math.random() < 0.7) {
    let k = randomInt(1, 3);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, '[' + String.fromCharCode(65 + randomInt(0, 25)) + ']');
  }
  if (doDecor && Math.random() < 0.75) {
    let k = randomInt(1, 4);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, randomChoice(DECOR_TOKENS));
  }
  if (doCn && Math.random() < 0.65) {
    let k = randomInt(1, 3);
    for(let i=0; i<k; i++) tokens.splice(randomInt(1, tokens.length-1), 0, randomChoice(CN_CHARS));
  }
  return tokens.join(' ').replace(/\s+/g, ' ').trim();
}

function generateEnglishAddress(country, useHouse, baseWords) {
  const countries = Object.keys(EN_ADDRESS_POOLS);
  if (!country || country === "Random") {
      country = randomChoice(countries);
  }
  const pool = EN_ADDRESS_POOLS[country];
  const city = randomChoice(pool.cities);
  const region = randomChoice(pool.regions);
  const street = randomChoice(pool.streets);
  const houseNo = randomInt(1, 9999).toString();

  let extra = "";
  if (Math.random() < 0.45) {
      extra = ", " + randomChoice(pool.extras) + " " + randomInt(1, 99);
  }
  const postal = randomInt(pool.postal[0], pool.postal[1]).toString();

  let line1 = useHouse ? `${houseNo} ${street}${extra}` : `${street}${extra}`;

  const bldgWords = ["Tower","Plaza","Residences","Heights","Centre","Court"];
  const bldgPrefix = randomChoice(["Sunrise","Central","River","Green","Sky","Grand","Royal","Metro"]);

  let parts = [line1, city, `${region} ${postal}`];

  if (Math.random() < 0.5) {
      parts.splice(1, 0, `${bldgPrefix} ${randomChoice(bldgWords)}`);
  }
  if (Math.random() < 0.4) {
      const lm = randomChoice(["Near","Opp.","Behind","Next to"]);
      const obj = randomChoice(["Mall","Station","Market","Park","School","Hospital"]);
      parts.push(`${lm} ${randomChoice(['Central','Main','City','Grand'])} ${obj}`);
  }

  let address = parts.filter(p => p).join(", ").trim();

  if (baseWords && baseWords.length > 0) {
      address = weaveWordsIntoAddress(address, baseWords);
  }
  return address;
}

function weaveWordsIntoAddress(address, words) {
  if (!words || words.length === 0) return address;
  let tokens = address.replace(/,/g, " ,").split(" ");
  if (tokens.length < 2) return address;

  let transformed = words.map(w => {
      if (Math.random() < 0.3) return w.replace('มิ้น', 'มินต์').replace('กันจุ', 'กันจุุ');
      return w;
  });

  let out = [];
  let wi = 0;
  for (let i = 0; i < tokens.length; i++) {
      out.push(tokens[i]);
      if (wi < transformed.length && i > 0 && (i % Math.max(1, Math.floor(tokens.length / (transformed.length + 1)))) === 0) {
          out.push(transformed[wi]);
          wi++;
      }
  }
  while (wi < transformed.length) {
      out.splice(randomInt(1, Math.max(1, out.length - 1)), 0, transformed[wi]);
      wi++;
  }
  return out.join(" ").replace(/ ,/g, ",").trim();
}

function showToast(msg) {
  const t = document.getElementById('toastNotice');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add('hidden'), 2000);
}

function clipCopy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ คัดลอกสำเร็จ!'));
  } else {
    let ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ คัดลอกสำเร็จ!');
  }
}

// --- ระบบบันทึกและโหลดค่า (LocalStorage) ---
function saveSettings() {
  const settings = {
    freqText1: document.getElementById('freqText1').value,
    freqText2: document.getElementById('freqText2').value,
    freqText3: document.getElementById('freqText3').value,
    distRegion: document.getElementById('distRegion').value,
    distProvince: document.getElementById('distProvince').value,
    farmCount: document.getElementById('farmCount').value,
    farmStrength: document.getElementById('farmStrength').value,
    farmAddrType: document.getElementById('farmAddrType').value,
    farmBase: document.getElementById('farmBase').value,
    chkHouse: document.getElementById('chkHouse').checked,
    chkAz: document.getElementById('chkAz').checked,
    chkDecor: document.getElementById('chkDecor').checked,
    chkCn: document.getElementById('chkCn').checked,
    chkAuto: document.getElementById('chkAuto').checked,
  };
  localStorage.setItem('tao_web_settings', JSON.stringify(settings));
}

function loadSettings() {
  try {
    const raw = localStorage.getItem('tao_web_settings');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.freqText1 !== undefined) document.getElementById('freqText1').value = s.freqText1;
      if (s.freqText2 !== undefined) document.getElementById('freqText2').value = s.freqText2;
      if (s.freqText3 !== undefined) document.getElementById('freqText3').value = s.freqText3;
      if (s.distRegion !== undefined) {
        document.getElementById('distRegion').value = s.distRegion;
        onRegionChange();
      }
      if (s.distProvince !== undefined) document.getElementById('distProvince').value = s.distProvince;
      if (s.farmCount !== undefined) document.getElementById('farmCount').value = s.farmCount;
      if (s.farmStrength !== undefined) document.getElementById('farmStrength').value = s.farmStrength;
      if (s.farmAddrType !== undefined) document.getElementById('farmAddrType').value = s.farmAddrType;
      if (s.farmBase !== undefined) document.getElementById('farmBase').value = s.farmBase;
      if (s.chkHouse !== undefined) document.getElementById('chkHouse').checked = s.chkHouse;
      if (s.chkAz !== undefined) document.getElementById('chkAz').checked = s.chkAz;
      if (s.chkDecor !== undefined) document.getElementById('chkDecor').checked = s.chkDecor;
      if (s.chkCn !== undefined) document.getElementById('chkCn').checked = s.chkCn;
      if (s.chkAuto !== undefined) {
        document.getElementById('chkAuto').checked = s.chkAuto;
        toggleAuto();
      }
    }
  } catch(e) {}
}

// --- ฝั่งซ้าย: แสดงลิสต์อำเภอทั้งหมด (เอาชื่อจังหวัดออกแล้ว) ---
function onRegionChange() {
  const region = document.getElementById('distRegion').value;
  const provRow = document.getElementById('distProvinceRow');
  const provSelect = document.getElementById('distProvince');

  provSelect.innerHTML = '<option value="">ทั้งภาค</option>';

  if (region === 'all' || region === 'bangkok') {
    provRow.classList.add('hidden');
    return;
  }

  provRow.classList.remove('hidden');
  const provinces = Object.keys(THAI_DATA[region] || {});
  provinces.forEach(p => {
    let opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    provSelect.appendChild(opt);
  });
}

let _lastDistrictList = [];

function listAllDistricts() {
  const region = document.getElementById('distRegion').value;
  const province = document.getElementById('distProvince').value;

  let results = [];

  if (region === 'all') {
    Object.keys(THAI_DATA).forEach(reg => {
      Object.keys(THAI_DATA[reg]).forEach(prov => {
        THAI_DATA[reg][prov].forEach(dist => {
          results.push(dist);
        });
      });
    });
  } else if (province === '') {
    Object.keys(THAI_DATA[region]).forEach(prov => {
      THAI_DATA[region][prov].forEach(dist => {
        results.push(dist);
      });
    });
  } else {
    THAI_DATA[region][province].forEach(dist => {
      results.push(dist);
    });
  }

  if(results.length === 0) return alert("ไม่พบข้อมูลอำเภอ");

  _lastDistrictList = results;

  document.getElementById('distCountBadge').textContent = results.length + ' รายการ';

  const box = document.getElementById('distResultBox');
  box.innerHTML = '';

  results.forEach((displayText, idx) => {
    let row = document.createElement('div');
    row.className = 'result-item-row';
    row.innerHTML = `
      <span class="result-item-text"><span style="color:var(--text-dim);">#${idx+1}</span> &nbsp; ${displayText}</span>
      <button class="row-copy-btn" onclick="clipCopy('${displayText}')">📋</button>
    `;
    box.appendChild(row);
  });
}

function copyAllDistricts() {
  if (_lastDistrictList.length === 0) return alert("ยังไม่ได้แสดงข้อมูลอำเภอครับ");
  clipCopy(_lastDistrictList.join('\n'));
}


// --- ฝั่งขวา: สุ่มชุดข้อมูลหลัก (Farm Core Generator) ---
let _lastFarmData = [];

function generateFarmData() {
  const count = parseInt(document.getElementById('farmCount').value) || 1;
  const baseText = document.getElementById('farmBase').value.trim();
  const addrType = document.getElementById('farmAddrType').value;
  const useHouse = document.getElementById('chkHouse').checked;
  const doAz = document.getElementById('chkAz').checked;
  const doDecor = document.getElementById('chkDecor').checked;
  const doCn = document.getElementById('chkCn').checked;

  const baseWords = baseText ? baseText.split(/\s+/) : [];

  _lastFarmData = [];
  let notepadText = "===== 📱 ข้อมูลจัดส่ง =====\n";

  for(let i=0; i<count; i++) {
    let phone = randomChoice(PHONE_PREFIX) + randomInt(1000000, 9999999);
    let finalAddr = "";

    if (addrType === "th") {
        let addrBase = baseText ? baseText : randomChoice(DEFAULT_BASES);
        if(Math.random() < 0.3) addrBase = addrBase.replace('มิ้น', 'มินต์').replace('กันจุ', 'กันจุุ');
        if(useHouse) addrBase = randomInt(1, 999) + '/' + randomInt(1, 99) + ' ' + addrBase;

        finalAddr = applyInjections(addrBase, doAz, doDecor, doCn);
    } else {
        let country = "Random";
        if (addrType === "en_id") country = "Indonesia";
        if (addrType === "en_ph") country = "Philippines";
        if (addrType === "en_my") country = "Malaysia";
        if (addrType === "en_vn") country = "Vietnam";
        if (addrType === "en_us") country = "United States";

        let addrBase = generateEnglishAddress(country, useHouse, baseWords);
        finalAddr = applyInjections(addrBase, doAz, doDecor, doCn);
    }

    let fullLine = phone + " | " + finalAddr;
    _lastFarmData.push({ phone: phone, addr: finalAddr, full: fullLine });
    notepadText += (i+1) + ". " + fullLine + "\n";
  }

  document.getElementById('farmNotepad').value = notepadText;
  document.getElementById('farmBadge').textContent = count + ' ชุด';

  const box = document.getElementById('farmResultBox');
  box.innerHTML = '';
  _lastFarmData.forEach((item, idx) => {
    let row = document.createElement('div');
    row.className = 'result-item-row';
    row.innerHTML = `
      <span class="result-item-text" style="line-height:1.4;">
        <span style="color:#00ff88">${item.phone}</span><br>${item.addr}
      </span>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <button class="row-copy-btn" onclick="clipCopy('${item.phone}')" style="background:rgba(0,255,136,0.1); border-color:#00ff88; color:#00ff88;">📱 เบอร์</button>
        <button class="row-copy-btn" onclick="clipCopy('${item.addr}')" style="background:rgba(255,200,0,0.1); border-color:#ffcc00; color:#ffcc00;">🏠 ที่อยู่</button>
        <button class="row-copy-btn" onclick="clipCopy('${item.full}')">📋 ทั้งคู่</button>
      </div>
    `;
    box.appendChild(row);
  });

  const qrBox = document.getElementById('farmQrSection');
  if(!qrBox.classList.contains('hidden')) {
    qrBox.innerHTML = '';
    QRCode.toCanvas('📋\n' + notepadText, { width: 220, margin: 2 }, function(err, canvas) {
      if(!err) qrBox.appendChild(canvas);
    });
  }
}

function copyNotepad() { clipCopy(document.getElementById('farmNotepad').value); }

function toggleFarmQR() {
  const qrBox = document.getElementById('farmQrSection');
  qrBox.classList.toggle('hidden');
  if(!qrBox.classList.contains('hidden') && _lastFarmData.length > 0) {
    qrBox.innerHTML = '';
    QRCode.toCanvas('📋\n' + document.getElementById('farmNotepad').value, { width: 220, margin: 2 }, function(err, canvas) {
      if(!err) qrBox.appendChild(canvas);
    });
  }
}

// --- ระบบ Auto Random ---
let autoInterval = null;
let countdownInterval = null;
let secondsLeft = 60;

function toggleAuto() {
  const chk = document.getElementById('chkAuto');
  if(chk.checked) {
    secondsLeft = 60;
    generateFarmData();
    updateTimerUI();

    autoInterval = setInterval(() => { secondsLeft = 60; generateFarmData(); }, 60000);
    countdownInterval = setInterval(() => {
      secondsLeft--;
      if(secondsLeft < 0) secondsLeft = 0;
      updateTimerUI();
    }, 1000);
  } else {
    clearInterval(autoInterval);
    clearInterval(countdownInterval);
    document.getElementById('autoCountdown').textContent = "--:--";
  }
}

function updateTimerUI() {
  let m = Math.floor(secondsLeft / 60);
  let s = secondsLeft % 60;
  document.getElementById('autoCountdown').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// เริ่มต้นเปิดเว็บ
window.onload = function() {
  loadSettings(); // โหลดค่าที่เซ็ตไว้เดิม
  onRegionChange();
  listAllDistricts();
};
</script>
